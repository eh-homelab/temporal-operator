name: Publish eh-homelab fork release

# eh-homelab's fork (multi-cluster replication fields on TemporalCluster).
# A tag `v<upstream>-eh.<n>` builds and pushes ghcr.io/eh-homelab/temporal-operator:<tag>
# and creates a GitHub release carrying temporal-operator.crds.yaml and
# temporal-operator.yaml, the two assets eh-homelab/clusters vendors.
on:
  push:
    tags:
      - 'v*-eh.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Point the release manifest at this tag
        run: sed -i "s|^  newTag: .*|  newTag: ${GITHUB_REF_NAME}|" config/manager/kustomization.yaml
      - name: Generate release artifacts
        run: make artifacts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push operator image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/eh-homelab/temporal-operator:${{ github.ref_name }}
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/release/artifacts/*.yaml

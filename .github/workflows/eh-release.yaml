name: Publish eh-homelab fork release

# eh-homelab's fork (multi-cluster replication fields on TemporalCluster).
# A tag `v<upstream>-eh.<n>` builds and pushes ghcr.io/eh-homelab/temporal-operator:<tag>
# and creates a GitHub release carrying temporal-operator.crds.yaml and
# temporal-operator.yaml, the two assets eh-homelab/clusters vendors.
#
# Kept 1:1 with upstream's release.yaml (same actions, multi-arch image, OCI
# labels from docker/metadata-action). The differences, and why:
#   - triggered by the tag push, not by `release: created`: this job creates
#     the release itself;
#   - the release manifest points at this fork's image, not upstream's;
#   - no OperatorHub bundle image: nothing here installs through OLM;
#   - a check that the package is public, which the nodes' anonymous ghcr
#     proxy needs.
on:
  push:
    tags:
      - 'v*-eh.*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          check-latest: true
      - name: Point the release manifest at this tag
        run: |
          make kustomize
          cd config/manager
          ../../bin/kustomize edit set image "ghcr.io/alexandrevilain/temporal-operator=${REGISTRY}/eh-homelab/temporal-operator:${GITHUB_REF_NAME}"
      - name: Generate release artifacts
        run: make artifacts
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/eh-homelab/temporal-operator
          tags: |
            type=ref,event=tag
      - name: Build and push operator docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Nodes pull ghcr.io through an anonymous proxy. A new package is private,
      # and no API can make it public, so fail here until it is.
      - name: Check the image is publicly pullable
        run: |
          # A private package answers 403 already at the token endpoint.
          if ! token=$(curl -fsS "https://ghcr.io/token?scope=repository:eh-homelab/temporal-operator:pull" | jq -r .token) ||
            ! curl -fsSI -o /dev/null \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/eh-homelab/temporal-operator/manifests/${GITHUB_REF_NAME}"; then
            echo "::error::ghcr.io/eh-homelab/temporal-operator is not public. Make the package public, then re-run this job."
            exit 1
          fi
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/release/artifacts/*.yaml

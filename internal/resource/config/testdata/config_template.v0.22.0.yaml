global:
    membership:
        maxJoinDuration: 30s
        broadcastAddress: '{{ default .Env.POD_IP "0.0.0.0" }}'
    pprof:
        port: 0
        host: ""
    tls:
        internode:
            client:
                serverName: ""
                disableHostVerification: false
                rootCaFiles: []
                rootCaData: []
                forceTLS: false
            server:
                certFile: ""
                keyFile: ""
                clientCaFiles: []
                certData: ""
                keyData: ""
                clientCaData: []
                requireClientAuth: false
            hostOverrides: {}
        frontend:
            client:
                serverName: ""
                disableHostVerification: false
                rootCaFiles: []
                rootCaData: []
                forceTLS: false
            server:
                certFile: ""
                keyFile: ""
                clientCaFiles: []
                certData: ""
                keyData: ""
                clientCaData: []
                requireClientAuth: false
            hostOverrides: {}
        systemWorker:
            certFile: ""
            keyFile: ""
            certData: ""
            keyData: ""
            client:
                serverName: ""
                disableHostVerification: false
                rootCaFiles: []
                rootCaData: []
                forceTLS: false
        remoteClusters: {}
        expirationChecks:
            warningWindow: 0s
            errorWindow: 0s
            checkInterval: 0s
        refreshInterval: 0s
    metrics:
        tags:
            type: '{{ .Env.SERVICES }}'
        excludeTags: {}
        prefix: ""
        perUnitHistogramBoundaries: {}
        withoutUnitSuffix: false
        withoutCounterSuffix: false
        recordTimerInSeconds: false
        statsd: null
        prometheus:
            framework: ""
            listenAddress: 0.0.0.0:9090
            handlerPath: ""
            loggerRPS: 0
            listenNetwork: ""
            timerType: histogram
            defaultHistogramBoundaries: []
            defaultHistogramBuckets: []
            defaultSummaryObjectives: []
            onError: ""
            sanitizeOptions: null
    authorization:
        jwtKeyProvider:
            keySourceURIs: []
            refreshInterval: 0s
        permissionsClaimName: ""
        authorizer: ""
        claimMapper: ""
        authHeaderName: ""
        authExtraHeaderName: ""
persistence:
    defaultStore: default
    visibilityStore: visibility
    secondaryVisibilityStore: ""
    numHistoryShards: 4
    datastores:
        default:
            faultInjection: null
            cassandra: null
            sql:
                user: temporal
                password: '{{ .Env.TEMPORAL_DEFAULT_DATASTORE_PASSWORD }}'
                pluginName: postgres12
                databaseName: temporal
                connectAddr: db-rw:5432
                connectProtocol: tcp
                connectAttributes: {}
                maxConns: 8
                maxIdleConns: 4
                maxConnLifetime: 0s
                taskScanPartitions: 0
                tls: null
            customDatastore: null
            elasticsearch: null
        visibility:
            faultInjection: null
            cassandra: null
            sql:
                user: temporal
                password: '{{ .Env.TEMPORAL_VISIBILITY_DATASTORE_PASSWORD }}'
                pluginName: postgres12
                databaseName: temporal_visibility
                connectAddr: db-rw:5432
                connectProtocol: tcp
                connectAttributes: {}
                maxConns: 8
                maxIdleConns: 4
                maxConnLifetime: 0s
                taskScanPartitions: 0
                tls: null
            customDatastore: null
            elasticsearch: null
    advancedVisibilityStore: ""
log:
    stdout: true
    level: info
    outputFile: ""
    format: json
    development: false
clusterMetadata:
    enableGlobalNamespace: false
    failoverVersionIncrement: 10
    masterClusterName: temporal
    currentClusterName: temporal
    clusterInformation:
        temporal:
            enabled: true
            initialFailoverVersion: 1
            rpcAddress: 127.0.0.1:7233
            httpAddress: ""
    tags: {}
dcRedirectionPolicy:
    policy: ""
services:
    frontend:
        rpc:
            grpcPort: 7233
            membershipPort: 6933
            bindOnLocalHost: false
            bindOnIP: 0.0.0.0
            httpPort: 7243
            httpAdditionalForwardedHeaders: []
            keepAliveServerConfig:
                keepAliveServerParameters: null
                keepAliveEnforcementPolicy: null
            clientConnectionConfig:
                keepAliveClientParameters: null
    history:
        rpc:
            grpcPort: 7234
            membershipPort: 6934
            bindOnLocalHost: false
            bindOnIP: 0.0.0.0
            httpPort: 0
            httpAdditionalForwardedHeaders: []
            keepAliveServerConfig:
                keepAliveServerParameters: null
                keepAliveEnforcementPolicy: null
            clientConnectionConfig:
                keepAliveClientParameters: null
    matching:
        rpc:
            grpcPort: 7235
            membershipPort: 6935
            bindOnLocalHost: false
            bindOnIP: 0.0.0.0
            httpPort: 0
            httpAdditionalForwardedHeaders: []
            keepAliveServerConfig:
                keepAliveServerParameters: null
                keepAliveEnforcementPolicy: null
            clientConnectionConfig:
                keepAliveClientParameters: null
    worker:
        rpc:
            grpcPort: 7239
            membershipPort: 6939
            bindOnLocalHost: false
            bindOnIP: 0.0.0.0
            httpPort: 0
            httpAdditionalForwardedHeaders: []
            keepAliveServerConfig:
                keepAliveServerParameters: null
                keepAliveEnforcementPolicy: null
            clientConnectionConfig:
                keepAliveClientParameters: null
archival:
    history:
        state: ""
        enableRead: false
        provider: null
    visibility:
        state: ""
        enableRead: false
        provider: null
publicClient:
    hostPort: ""
    httpHostPort: ""
    forceTLSConfig: ""
dynamicConfigClient: null
namespaceDefaults:
    archival:
        history:
            state: ""
            URI: ""
        visibility:
            state: ""
            URI: ""
otel: {}
